 # Configura\uFFFD\uFFFDes de Conex\uFFFDo com o Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zenocom}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configura\uFFFD\uFFFDes do JPA / Hibernate para Produ\uFFFD\uFFFDo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inicializa\uFFFD\uFFFDo de Scripts SQL (Desativado em produ\uFFFD\uFFFDo para evitar rodar scripts repetidos)
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=false

# Porta do Servidor
server.port=${PORT:8090}

# Configura\uFFFD\uFFFDes do JWT
jwt.secret=${JWT_SECRET:D2ticomJWT2026MinhaChaveSuperSecretaComMaisDe32Caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

pdv.desconto.limite-percentual=5
